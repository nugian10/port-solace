<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Port Solace — a small-time driver story</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #10151c;
    font-family: Verdana, Geneva, Tahoma, sans-serif; color: #f5efe2; }
  #app { position: fixed; inset: 0; }
  canvas.webgl { display: block; width: 100%; height: 100%; }
  .hidden { display: none !important; }

  /* ---------- HUD ---------- */
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud-topleft { position: absolute; top: 16px; left: 18px; width: 230px; }
  #healthbar { height: 13px; background: rgba(10,12,16,0.62); border: 2px solid rgba(255,255,255,0.5);
    border-radius: 4px; overflow: hidden; }
  #healthfill { height: 100%; width: 100%; background: #7ee787; transition: width 0.18s; }
  #cash { font-size: 27px; font-weight: 900; color: #8be26a; text-shadow: 2px 2px 0 rgba(0,0,0,0.55);
    margin-top: 5px; letter-spacing: 0.5px; }
  #joblabel { font-size: 12.5px; color: #ffd76b; text-shadow: 1px 1px 0 rgba(0,0,0,0.7); margin-top: 2px; }
  #hud-topright { position: absolute; top: 12px; right: 20px; text-align: right; }
  #stars { font-size: 30px; letter-spacing: 3px; text-shadow: 2px 2px 0 rgba(0,0,0,0.5); }
  #heatbar { width: 150px; height: 6px; background: rgba(10,12,16,0.55); border-radius: 3px;
    margin-left: auto; margin-top: 3px; overflow: hidden; }
  #heatfill { height: 100%; width: 0%; background: #e2543e; }
  #banner { position: absolute; top: 15%; left: 0; right: 0; text-align: center; font-size: 34px;
    font-weight: 900; letter-spacing: 2px; color: #ffd76b; text-shadow: 3px 3px 0 rgba(0,0,0,0.6); }
  #minimap-wrap { position: absolute; left: 18px; bottom: 18px; width: 190px; }
  #minimap { border: 3px solid rgba(255,255,255,0.55); border-radius: 8px; background: #2a7d9e;
    box-shadow: 0 4px 14px rgba(0,0,0,0.45); }
  #maplabel { text-align: center; font-size: 11.5px; color: #fff; text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
    margin-top: 3px; letter-spacing: 1px; }
  #objective { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    max-width: 620px; background: rgba(10,14,20,0.68); border-left: 5px solid #ffd76b;
    padding: 9px 16px; font-size: 16.5px; border-radius: 4px; text-shadow: 1px 1px 0 #000; }
  #dialogue { position: absolute; left: 50%; bottom: 86px; transform: translateX(-50%); width: 640px;
    max-width: 86vw; background: rgba(8,10,14,0.78); border-radius: 8px; padding: 12px 18px;
    font-size: 16px; line-height: 1.45; border: 1px solid rgba(255,215,107,0.35); }
  #toast { position: absolute; left: 50%; bottom: 170px; transform: translateX(-50%);
    background: rgba(20,26,18,0.82); color: #b7f49a; padding: 8px 16px; border-radius: 20px;
    font-size: 15px; }
  #speedo { position: absolute; right: 24px; bottom: 22px; text-align: right;
    text-shadow: 2px 2px 0 rgba(0,0,0,0.6); }
  #speedo span { font-size: 44px; font-weight: 900; }
  #speedo small { font-size: 14px; margin-left: 5px; color: #ffd76b; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    font-size: 26px; color: rgba(255,255,255,0.9); text-shadow: 0 0 4px #000; }
  #hint { position: absolute; right: 24px; bottom: 84px; font-size: 13.5px; color: #ffe9ad;
    text-shadow: 1px 1px 0 rgba(0,0,0,0.85); text-align: right; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 6; opacity: 0;
    transition: opacity 0.35s; background: radial-gradient(ellipse at center, transparent 42%, rgba(190,10,0,0.55) 100%); }

  /* ---------- overlays ---------- */
  .overlay { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center;
    justify-content: center; background: linear-gradient(180deg, rgba(16,32,54,0.55), rgba(30,16,8,0.72)); }
  .panel { background: rgba(10,16,24,0.88); border: 2px solid rgba(255,215,107,0.5); border-radius: 14px;
    padding: 30px 40px; max-width: 620px; text-align: center; box-shadow: 0 18px 60px rgba(0,0,0,0.6); }
  .panel.small { max-width: 340px; }
  .panel h1 { margin: 0; font-size: 54px; letter-spacing: 4px; color: #ffd76b;
    text-shadow: 3px 3px 0 #b3541e; }
  .panel h2 { margin: 0 0 14px; font-size: 30px; letter-spacing: 3px; color: #ffd76b; }
  .tagline { color: #9fd4e8; font-style: italic; margin: 4px 0 12px; font-size: 16px; }
  .blurb { font-size: 14.5px; line-height: 1.55; color: #e8e2d2; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 5px 18px; text-align: left;
    font-size: 13px; margin: 16px auto 20px; max-width: 470px; color: #cfd8de; }
  .controls b { color: #ffd76b; }
  .buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  button { pointer-events: auto; cursor: pointer; font-family: inherit; font-weight: 900;
    letter-spacing: 1px; font-size: 16px; color: #1c1408; background: linear-gradient(180deg, #ffd76b, #e8a33d);
    border: none; border-radius: 8px; padding: 12px 26px; box-shadow: 0 4px 0 #9c6a1d; }
  button:hover { filter: brightness(1.08); }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 #9c6a1d; }
  .panel.small .buttons { flex-direction: column; }
  .foot { font-size: 11.5px; color: #8b98a3; margin-top: 16px; }
  #endscreen { flex-direction: column; background: rgba(6,6,8,0.45); }
  #endtext { font-size: 84px; font-weight: 900; letter-spacing: 10px; text-shadow: 4px 4px 0 rgba(0,0,0,0.7); }
  #endsub { font-size: 18px; color: #f5efe2; text-shadow: 2px 2px 0 rgba(0,0,0,0.8); margin-top: 8px; }
  #test-results { position: fixed; left: 8px; top: 8px; z-index: 50; background: #fff; color: #000;
    font: 12px monospace; padding: 8px; white-space: pre-wrap; max-width: 90vw; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
